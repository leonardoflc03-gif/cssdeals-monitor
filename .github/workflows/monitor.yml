name: Monitor CSSDeals

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o mínimo do GitHub; às vezes atrasa um pouco)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

concurrency:
  group: cssdeals-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Recupera a lista de itens já vistos da execução anterior
      - name: Restaurar memória
        uses: actions/cache/restore@v4
        with:
          path: seen_ids.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Procurar itens novos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Filtros opcionais: crie em Settings > Secrets and variables > Actions > Variables
          KEYWORDS: ${{ vars.KEYWORDS }}
          SIZES: ${{ vars.SIZES }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          CATEGORIES: ${{ vars.CATEGORIES }}
        run: python monitor.py

      - name: Salvar memória
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_ids.json
          key: seen-${{ github.run_id }}
